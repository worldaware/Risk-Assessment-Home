name: Data refresh

# Builds data/radon-zones.json (EPA radon zones by county) and
# data/power-reliability.json (EIA-861 utility reliability by county) with
# scripts/build-data.js, then opens a pull request with whatever changed.
# It never pushes to main: review the pull request and merge it yourself.
# EIA publishes the final data for a year in October of the next year. With no
# year given, the script works out the latest final year from today's date
# (from October, last year; before October, the year before). Pick a year by
# hand only to rebuild an older one.

on:
  workflow_dispatch:
    inputs:
      eia_year:
        description: 'EIA-861 data year (the f861<year>.zip file); leave empty for the latest final year'
        required: false
        default: ''
  schedule:
    # Yearly, July 2 at 09:17 UTC (first week of July)
    - cron: '17 9 2 7 *'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the token out of .git/config while npm install and the script run;
          # create-pull-request uses its own token input.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the spreadsheet reader (build time only; the app has no dependencies)
        run: npm install xlsx@0.18.5 --no-save
      - name: Build the data files
        env:
          EIA_YEAR: ${{ inputs.eia_year }}
        run: |
          if [ -n "$EIA_YEAR" ]; then
            node scripts/build-data.js --out data --year "$EIA_YEAR"
          else
            node scripts/build-data.js --out data
          fi
      - name: Open a pull request with the changed data files
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/refresh
          title: 'Data refresh: radon zones and power reliability'
          commit-message: 'Data refresh: radon zones and power reliability'
          add-paths: data/*.json
          body: |
            Rebuilt by the Data refresh workflow from the EPA radon zone file and the EIA-861 reliability and service territory files.

            Before merging, open the diff and check that the county and utility counts did not drop and that Boulder County (radon zone 1, utilities under 08013) still looks right.
